name: Release

# A tag like v0.1.0 builds the Android APK and attaches it to a DRAFT GitHub release; a person reads it and presses publish.
# Signing material comes only from repository secrets (never the repo): ANDROID_KEYSTORE_BASE64 (the keystore file, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the APK is signed with the .NET Android
# debug key: installable by hand, not for a store, and the release notes say so.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install android workload
        run: dotnet workload install android
      - name: Work out the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Decode the keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK (release key)
        if: steps.keystore.outputs.signed == 'true'
        run: >-
          dotnet publish src/AlertBuddy.Android -c Release
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.name }} -p:ApplicationVersion=${{ github.run_number }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build the APK (debug key)
        if: steps.keystore.outputs.signed != 'true'
        run: dotnet publish src/AlertBuddy.Android -c Release -p:ApplicationDisplayVersion=${{ steps.version.outputs.name }} -p:ApplicationVersion=${{ github.run_number }}
      - name: Collect the APK
        run: |
          mkdir -p release
          cp src/AlertBuddy.Android/bin/Release/net10.0-android/*-Signed.apk release/AlertBuddy-${{ steps.version.outputs.name }}.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Alert Buddy ${{ steps.version.outputs.name }}
          draft: true
          generate_release_notes: true
          body: |
            Alert Buddy is a helper. It does not replace smoke or heat alarms. This build has run on an emulator, not yet on a real phone.
            ${{ steps.keystore.outputs.signed != 'true' && 'Signed with the .NET Android debug key: install by hand, not for a store.' || '' }}
          files: release/*
